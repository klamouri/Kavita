name: Fork Docker Publish

# Builds the Strict-parser fork as a multi-arch Docker image and pushes it to
# GitHub Container Registry under the repository owner's namespace.
#
# Trigger:
#   - Push of any tag matching v*-patched-* (e.g. v0.9.0.2-patched-0.1.0). Image is
#     tagged with the same tag string AND :latest is moved to point at it.
#   - Manual dispatch (lets you push an ad-hoc tag without cutting a real one).

on:
  push:
    tags:
      - 'v*-patched-*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to push (defaults to the short SHA when triggered manually).'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push fork image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
            echo "TAG=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "TAG=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build UI
        run: |
          cd UI/Web
          npm install --legacy-peer-deps
          npm run prod
          rsync -a dist/ ../../Kavita.Server/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build runtimes
        run: ./monorepo-build.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.resolve_tag.outputs.OWNER_LC }}/kavita-strict-fork:${{ steps.resolve_tag.outputs.TAG }}
            ghcr.io/${{ steps.resolve_tag.outputs.OWNER_LC }}/kavita-strict-fork:latest

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
